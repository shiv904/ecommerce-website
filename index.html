<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShopSmart — E‑commerce Frontend</title>
    <meta name="description" content="A modern, responsive e‑commerce storefront." />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E🛒%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar" aria-label="Primary">
        <a class="brand" href="#" aria-label="ShopSmart Home">ShopSmart</a>

        <div class="nav-controls">
          <label class="search" aria-label="Search products">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="icon">
              <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input id="searchInput" type="search" placeholder="Search products…" autocomplete="off" />
          </label>

          <select id="categorySelect" class="select" aria-label="Filter by category">
            <option value="all">All categories</option>
          </select>

          <select id="sortSelect" class="select" aria-label="Sort products">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating-desc">Rating</option>
          </select>

          <button id="cartButton" class="cart-button" aria-label="Open cart" aria-haspopup="dialog">
            <span class="cart-icon" aria-hidden="true">🛒</span>
            <span id="cartCount" class="cart-count" aria-live="polite">0</span>
          </button>
        </div>
      </nav>

      <section class="hero">
        <div class="hero-inner">
          <h1>Discover products you love</h1>
          <p>Modern storefront UI with search, filters, sorting, product details and a cart.</p>
          <a href="#products" class="btn btn-primary">Shop now</a>
        </div>
      </section>
    </header>

    <main id="main" class="container">
      <section id="products" class="products" aria-label="Products">
        <div id="productsGrid" class="grid" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; <span id="year"></span> ShopSmart. Built for demo purposes.</p>
    </footer>

    <!-- Product Modal -->
    <div id="productModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="true"></div>
      <div class="modal-dialog" role="document">
        <button class="modal-close" id="modalClose" aria-label="Close product details">&times;</button>
        <div class="modal-body">
          <div class="modal-media">
            <img id="modalImage" src="" alt="" />
          </div>
          <div class="modal-content">
            <h2 id="modalTitle"></h2>
            <p id="modalDescription" class="muted"></p>
            <div class="price-row">
              <span id="modalPrice" class="price"></span>
              <span id="modalRating" class="rating" aria-label="Rating"></span>
            </div>
            <div class="qty-row">
              <label for="modalQty">Quantity</label>
              <div class="qty">
                <button id="qtyDec" class="qty-btn" aria-label="Decrease quantity">−</button>
                <input id="modalQty" type="number" min="1" value="1" inputmode="numeric" />
                <button id="qtyInc" class="qty-btn" aria-label="Increase quantity">+</button>
              </div>
            </div>
            <button id="addToCartBtn" class="btn btn-primary">Add to cart</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Cart Drawer -->
    <div id="drawerOverlay" class="drawer-overlay" data-close-drawer="true" hidden></div>
    <aside id="cartDrawer" class="drawer" aria-labelledby="cartTitle" aria-modal="true" role="dialog" hidden>
      <header class="drawer-header">
        <h2 id="cartTitle">Your Cart</h2>
        <button id="drawerClose" class="icon-btn" aria-label="Close cart">&times;</button>
      </header>
      <div id="cartItems" class="drawer-body"></div>
      <footer class="drawer-footer">
        <div class="totals">
          <span>Subtotal</span>
          <strong id="cartSubtotal">$0.00</strong>
        </div>
        <button id="checkoutBtn" class="btn btn-primary">Checkout</button>
      </footer>
    </aside>

    <script src="assets/js/app.js" defer></script>
  </body>
  </html>
